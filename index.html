<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="js/intro.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acacia Engineering | Solar Solutions in Jaipur</title>
    <meta
      name="description"
      content="Solar panel design, installation and maintenance world wide. Sunlight to Solutions."
    />
    <meta name="theme-color" content="#1c3326" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="assets/img/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS: order matters (later files override earlier ones) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/upgrade.css" />
    <link rel="stylesheet" href="css/industries.css" />
    <link rel="stylesheet" href="css/additions.css" />
  </head>
  <body>
    <header id="hdr">
      <div class="wrap bar">
        <a href="#hero" aria-label="Acacia Engineering home"
          ><img src="assets/img/logo.png" alt="Acacia Engineering"
        /></a>
        <button
          class="menu"
          id="menu"
          aria-label="Open menu"
          aria-expanded="false"
        >
          <svg class="i" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16" /></svg>
        </button>
        <nav id="nav"></nav>
      </div>
    </header>
    <main id="app"></main>
    <footer><div class="wrap" id="foot"></div></footer>

    <!-- JS: classic scripts that share one scope, so order matters -->
    <script src="js/config.js"></script>
    <!-- Web3Forms key -->
    <script src="js/icons.js"></script>
    <!-- ICON, ic(), esc() -->
    <script src="js/helpers.js"></script>
    <!-- IM, head, cards, statsHtml, waves -->
    <script src="js/chrome.js"></script>
    <!-- nav + footer -->
    <script src="js/estimator.js"></script>
    <!-- "How big a solar plant do you need?" -->
    <script src="js/effects.js"></script>
    <!-- loadBg, parallax, reveal -->
    <script src="js/forms.js"></script>
    <!-- enquiry form submit -->
    <script src="js/wire.js"></script>
    <!-- header scroll, menu, count-up, newsletter -->
    <script src="js/home.js"></script>
    <!-- build(): the home page sections -->
    <script src="js/main.js"></script>
    <!-- loads data/content.json, calls build() -->
  </body>
</html>
